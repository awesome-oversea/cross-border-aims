name: AIMS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PROJECT_DIR: D:\Project\aims
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  lint:
    name: 代码检查
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          pip install ruff flake8 mypy
          pip install -r requirements.txt

      - name: Ruff检查
        run: ruff check skills/ scripts/ --output-format=github

      - name: Flake8检查
        run: flake8 skills/ scripts/ --max-line-length=120 --exclude=__pycache__

      - name: 类型检查
        run: mypy skills/ --ignore-missing-imports --no-error-summary

  test:
    name: 自动化测试
    runs-on: windows-latest
    needs: lint
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行技能测试
        run: python scripts/test_framework.py

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: runtime/logs/test_report_*.json

  security:
    name: 安全扫描
    runs-on: windows-latest
    needs: lint
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安全扫描
        run: |
          pip install bandit safety
          bandit -r skills/ scripts/ -f json -o runtime/logs/bandit_report.json || true
          safety check --json || true

      - name: 检查密钥泄露
        run: |
          $secrets = @("api_key", "secret", "password", "token", "credential")
          $found = $false
          Get-ChildItem -Path skills/, scripts/ -Recurse -Include *.py | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            foreach ($s in $secrets) {
              if ($content -match "$s\s*=\s*['\"][^'\"]{8,}['\"]") {
                Write-Host "WARNING: Possible hardcoded secret in $($_.FullName)"
                $found = $true
              }
            }
          }
          if ($found) { Write-Host "Found potential secrets! Please review." }

      - name: 上传安全报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: runtime/logs/bandit_report.json

  build:
    name: 构建Docker镜像
    runs-on: windows-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/aims:latest
            ${{ secrets.DOCKER_REGISTRY }}/aims:${{ github.sha }}

  deploy-staging:
    name: 部署到测试环境
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到测试环境
        run: |
          docker compose -f docker-compose.yml up -d
          Start-Sleep -Seconds 30
          $response = Invoke-WebRequest -Uri http://localhost:18789/health -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            Write-Host "Health check failed!"
            exit 1
          }
          Write-Host "Staging deployment successful!"

  deploy-production:
    name: 部署到生产环境
    runs-on: windows-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到生产环境
        run: |
          helm upgrade aims ./helm/aims `
            --namespace aims `
            --values ./helm/aims/values-prod.yaml `
            --set image.tag=${{ github.sha }} `
            --wait `
            --timeout 300s

      - name: 生产环境健康检查
        run: |
          $response = Invoke-WebRequest -Uri https://aims.example.com/health -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            Write-Host "Production health check failed! Rolling back..."
            helm rollback aims --namespace aims
            exit 1
          }
          Write-Host "Production deployment successful!"