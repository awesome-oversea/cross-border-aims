global:
  storageClass: shared-runtime-sc
  sharedNamespace: shared-infra

openclaw:
  enabled: true
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  env:
    llmOllamaEndpoint: http://ollama.shared-infra.svc.cluster.local:11434

mysql:
  enabled: false

redis:
  enabled: false

etcd:
  enabled: false

minio:
  enabled: false

milvus:
  enabled: false

qdrant:
  enabled: false

externalDependencies:
  redis:
    host: redis.shared-infra.svc.cluster.local
    port: 6379
  minio:
    endpoint: http://minio.shared-infra.svc.cluster.local:9000
  qdrant:
    host: qdrant.shared-infra.svc.cluster.local
    port: 6333
  milvus:
    host: milvus.shared-infra.svc.cluster.local
    port: 19530
  ollama:
    endpoint: http://ollama.shared-infra.svc.cluster.local:11434

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: aims.example.com
      paths:
        - path: /
          pathType: Prefix
          service: openclaw
          port: 18789

networkPolicy:
  enabled: true

monitoring:
  enabled: true
