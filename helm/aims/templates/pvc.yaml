{{- if .Values.openclaw.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aims.fullname" . }}-workspace-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.openclaw.persistence.size | default "10Gi" }}
  storageClassName: {{ .Values.global.storageClass | default "standard" }}
{{- end }}
