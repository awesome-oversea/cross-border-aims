spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    {{- include "aims.selectorLabels" . | nindent 4 }}
    app: redis
{{- end }}
---
{{- if .Values.etcd.enabled }}
apiVersion: v1
