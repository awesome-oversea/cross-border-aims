{{- if .Values.openclaw.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aims.fullname" . }}-openclaw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aims.labels" . | nindent 4 }}
    app: openclaw
spec:
  type: ClusterIP
  ports:
  - port: 18789
    targetPort: 18789
    protocol: TCP
    name: gateway
  selector:
    {{- include "aims.selectorLabels" . | nindent 4 }}
    app: openclaw
{{- end }}
---
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aims.fullname" . }}-mysql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aims.labels" . | nindent 4 }}
    app: mysql
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP
    name: mysql
  selector:
    {{- include "aims.selectorLabels" . | nindent 4 }}
    app: mysql
{{- end }}
---
{{- if .Values.redis.enabled }}
apiVersion: v1
