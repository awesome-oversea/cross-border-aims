  name: {{ include "aims.fullname" . }}-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aims.labels" . | nindent 4 }}
    app: etcd
spec:
  type: ClusterIP
  ports:
  - port: 2379
    targetPort: 2379
    protocol: TCP
    name: client
  selector:
    {{- include "aims.selectorLabels" . | nindent 4 }}
