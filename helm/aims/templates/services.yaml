spec:
  type: ClusterIP
  ports:
  - port: 19530
    targetPort: 19530
    protocol: TCP
    name: grpc
  - port: 9091
    targetPort: 9091
    protocol: TCP
    name: metrics
  selector:
    {{- include "aims.selectorLabels" . | nindent 4 }}
    app: milvus
{{- end }}
---
{{- if .Values.qdrant.enabled }}
apiVersion: v1
