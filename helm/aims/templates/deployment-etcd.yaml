{{- if .Values.etcd.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aims.fullname" . }}-etcd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aims.labels" . | nindent 4 }}
    app: etcd
spec:
  replicas: {{ .Values.etcd.replicaCount }}
  selector:
    matchLabels:
      {{- include "aims.selectorLabels" . | nindent 6 }}
      app: etcd
  template:
    metadata:
      labels:
        {{- include "aims.selectorLabels" . | nindent 8 }}
        app: etcd
    spec:
      containers:
      - name: etcd
        image: "{{ .Values.etcd.image.repository }}:{{ .Values.etcd.image.tag }}"
        imagePullPolicy: {{ .Values.etcd.image.pullPolicy }}
        ports:
        - containerPort: 2379
          name: client
        env:
        - name: ETCD_AUTO_COMPACTION_MODE
          valueFrom:
            configMapKeyRef:
              name: {{ include "aims.fullname" . }}-config
              key: ETCD_AUTO_COMPACTION_MODE
        - name: ETCD_AUTO_COMPACTION_RETENTION
          valueFrom:
            configMapKeyRef:
              name: {{ include "aims.fullname" . }}-config
              key: ETCD_AUTO_COMPACTION_RETENTION
        - name: ETCD_QUOTA_BACKEND_BYTES
          valueFrom:
            configMapKeyRef:
              name: {{ include "aims.fullname" . }}-config
              key: ETCD_QUOTA_BACKEND_BYTES
        - name: ETCD_SNAPSHOT_COUNT
          valueFrom:
            configMapKeyRef:
              name: {{ include "aims.fullname" . }}-config
              key: ETCD_SNAPSHOT_COUNT
        command:
        - /usr/local/bin/etcd
        - --advertise-client-urls=http://127.0.0.1:2379
        - --listen-client-urls=http://0.0.0.0:2379
        - --data-dir=/etcd
        volumeMounts:
        - name: etcd-data
          mountPath: /etcd
        resources:
          {{- toYaml .Values.etcd.resources | nindent 10 }}
      volumes:
      - name: etcd-data
        persistentVolumeClaim:
          claimName: {{ include "aims.fullname" . }}-etcd-pvc
{{- end }}