{{- if .Values.qdrant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aims.fullname" . }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aims.labels" . | nindent 4 }}
    app: qdrant
spec:
  replicas: {{ .Values.qdrant.replicaCount }}
  selector:
    matchLabels:
      {{- include "aims.selectorLabels" . | nindent 6 }}
      app: qdrant
  template:
    metadata:
      labels:
        {{- include "aims.selectorLabels" . | nindent 8 }}
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
        imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
        ports:
        - containerPort: 6333
          name: http
        - containerPort: 6334
          name: grpc
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
        livenessProbe:
          httpGet:
            path: /health
            port: 6333
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 6333
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.qdrant.resources | nindent 10 }}
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: {{ include "aims.fullname" . }}-qdrant-pvc
{{- end }}